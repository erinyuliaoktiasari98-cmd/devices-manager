name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Agent App Release APK
      run: ./gradlew :agent-app:assembleRelease

    - name: Build Monitor App Release APK
      run: ./gradlew :monitor-app:assembleRelease

    - name: Upload Agent App APK
      uses: actions/upload-artifact@v4
      with:
        name: agent-app-release
        path: agent-app/build/outputs/apk/release/
        if-no-files-found: warn

    - name: Upload Monitor App APK
      uses: actions/upload-artifact@v4
      with:
        name: monitor-app-release
        path: monitor-app/build/outputs/apk/release/
        if-no-files-found: warn
