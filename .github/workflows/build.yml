name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Agent App Release APK
      run: ./gradlew :agent-app:assembleRelease

    - name: Build Monitor App Release APK
      run: ./gradlew :monitor-app:assembleRelease

    - name: Upload Agent App APK
      uses: actions/upload-artifact@v3
      with:
        name: agent-app-release
        path: agent-app/build/outputs/apk/release/

    - name: Upload Monitor App APK
      uses: actions/upload-artifact@v3
      with:
        name: monitor-app-release
        path: monitor-app/build/outputs/apk/release/

    - name: Create Release
      if: github.event_name == 'push'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release ${{ github.run_number }}
        body: |
          Automatic build from commit ${{ github.sha }}
          
          **APK Files:**
          - agent-app-release.apk
          - monitor-app-release.apk
        draft: false
        prerelease: false
