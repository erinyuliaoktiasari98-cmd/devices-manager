name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Monitor App Release APK
      run: ./gradlew :monitor-app:assembleRelease --stacktrace

    - name: Build Agent App Release APK
      run: ./gradlew :agent-app:assembleRelease --stacktrace

    - name: Upload Monitor APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: monitor-app-release
        path: monitor-app/build/outputs/apk/release/
        retention-days: 7

    - name: Upload Agent APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: agent-app-release
        path: agent-app/build/outputs/apk/release/
        retention-days: 7
