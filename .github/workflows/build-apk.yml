name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Monitor App Release APK
      run: ./gradlew :monitor-app:assembleRelease

    - name: Build Agent App Release APK
      run: ./gradlew :agent-app:assembleRelease

    - name: Upload Monitor APK
      uses: actions/upload-artifact@v3
      with:
        name: monitor-app-release
        path: monitor-app/build/outputs/apk/release/

    - name: Upload Agent APK
      uses: actions/upload-artifact@v3
      with:
        name: agent-app-release
        path: agent-app/build/outputs/apk/release/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
